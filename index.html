<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Big Reveal Loading</title>
<style>
/* Layout: one plain centred column that builds up hype and delivers a potato. Dull grey-green office palette. */
:root {
  --bg: #d9ddd3;
  --ink: #2b2d28;
  --muted: #6b6f64;
  --bar: #4f7d52;
  --track: #c2c7bb;
  --spud: #c8a26b;
  --spud-dark: #9c7a45;
  --mono: "Courier New", Courier, monospace;
  --sans: "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  padding-inline: 16px;
  padding-block: 48px;
  min-height: 100vh;
}
main { max-width: 480px; margin-inline: auto; display: grid; gap: 20px; text-align: center; }
h1 { font-size: 1.6rem; margin: 0; text-wrap: balance; }
.mono { font-family: var(--mono); font-size: 0.95rem; color: var(--muted); margin: 0; min-height: 1.5em; }
.track { height: 22px; background: var(--track); border: 2px solid var(--ink); }
.bar { height: 100%; width: 0; background: var(--bar); }
.pct { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 2rem; margin: 0; }
button {
  font: inherit; font-size: 1rem; padding: 10px 18px; background: var(--bg); color: var(--ink);
  border: 2px solid var(--ink); cursor: pointer;
}
button:hover { background: var(--track); }
button:focus-visible { outline: 3px solid var(--bar); outline-offset: 3px; }
#reveal { display: none; gap: 16px; justify-items: center; }
#reveal.on { display: grid; }
svg { width: min(260px, 70vw); height: auto; }
.small { font-size: 12px; color: var(--muted); margin: 0; }
</style>

<main>
  <h1>Your surprise is loading</h1>
  <p class="mono" id="status">Warming up the surprise...</p>
  <div class="track" role="progressbar" aria-label="Surprise loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track"><div class="bar" id="bar"></div></div>
  <p class="pct" id="pct">0%</p>
  <button type="button" id="btn" hidden>Show me</button>

  <section id="reveal" aria-live="polite">
    <svg viewBox="0 0 260 180" role="img" aria-label="A drawn potato">
      <ellipse cx="130" cy="100" rx="105" ry="62" fill="#c8a26b" stroke="#2b2d28" stroke-width="4" transform="rotate(-8 130 100)"/>
      <circle cx="90" cy="85" r="5" fill="#9c7a45"/>
      <circle cx="150" cy="115" r="6" fill="#9c7a45"/>
      <circle cx="185" cy="80" r="4" fill="#9c7a45"/>
      <circle cx="110" cy="125" r="4" fill="#9c7a45"/>
      <circle cx="105" cy="97" r="4" fill="#2b2d28"/>
      <circle cx="140" cy="92" r="4" fill="#2b2d28"/>
      <path d="M108 112 Q123 120 138 110" fill="none" stroke="#2b2d28" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h1>It's a potato.</h1>
    <p class="mono" style="min-height:0">That's the whole link. Thanks for coming.</p>
    <button type="button" id="again">Load another surprise</button>
    <p class="small">Time wasted: <span id="wasted">0</span> seconds</p>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var steps = [
    'Warming up the surprise...',
    'Finding the surprise...',
    'Surprise found. Dusting it off...',
    'Reticulating splines...',
    'Asking the surprise to hurry up...',
    'Almost there (this is a lie)...',
    'Stuck at 99%. Normal.',
    'OK, now it is actually ready.'
  ];
  var p = 0, start = Date.now(), timer = null, stalled = 0;
  function set(v) {
    p = v;
    $('bar').style.width = v + '%';
    $('pct').textContent = Math.floor(v) + '%';
    $('track').setAttribute('aria-valuenow', Math.floor(v));
    $('status').textContent = steps[Math.min(steps.length - 2, Math.floor(v / 14.5))];
  }
  function run() {
    start = Date.now();
    $('reveal').classList.remove('on');
    $('btn').hidden = true;
    $('track').style.display = '';
    $('pct').style.display = '';
    set(0); stalled = 0;
    clearInterval(timer);
    timer = setInterval(function () {
      if (p < 99) { set(Math.min(99, p + (p > 80 ? 0.4 : 1.6) * Math.random() + 0.3)); }
      else {
        stalled++;
        $('status').textContent = steps[6];
        if (stalled > 25) {
          clearInterval(timer);
          $('status').textContent = steps[7];
          set(100);
          $('btn').hidden = false;
          $('btn').focus();
        }
      }
    }, 100);
  }
  $('btn').addEventListener('click', function () {
    $('btn').hidden = true;
    $('track').style.display = 'none';
    $('pct').style.display = 'none';
    $('status').textContent = '';
    $('wasted').textContent = Math.round((Date.now() - start) / 1000);
    $('reveal').classList.add('on');
  });
  $('again').addEventListener('click', run);
  run();
})();
</script>

</body></html>
